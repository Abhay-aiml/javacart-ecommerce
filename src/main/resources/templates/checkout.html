<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Checkout — JavaCart</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments :: header}"></div>

<main class="container">
  <h1 class="page-title">Checkout</h1>

  <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

  <table class="data-table" style="margin-bottom:24px;">
    <thead><tr><th>Product</th><th>Qty</th><th>Subtotal</th></tr></thead>
    <tbody>
      <tr th:each="item : ${cartItems}">
        <td th:text="${item.product.name}">Name</td>
        <td th:text="${item.quantity}">1</td>
        <td th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">₹0.00</td>
      </tr>
    </tbody>
  </table>

  <div class="cart-summary" style="justify-content:flex-start;margin-bottom:24px;">
    <div class="cart-total">Total: ₹<span th:text="${#numbers.formatDecimal(cartTotal, 1, 2)}">0.00</span></div>
  </div>

  <div class="form-card">
    <form th:action="@{/checkout}" method="post">
      <div class="form-group">
        <label for="shippingAddress">Shipping Address</label>
        <textarea id="shippingAddress" name="shippingAddress" required="required" th:text="${defaultAddress}"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Place Order</button>
    </form>
  </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
