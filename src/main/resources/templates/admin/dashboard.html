<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Admin Dashboard — JavaCart</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments :: header}"></div>

<main class="container">
  <h1 class="page-title">Admin Dashboard</h1>
  <div th:replace="~{admin/admin-fragments :: tabs(active='dashboard')}"></div>

  <div class="stat-cards">
    <div class="stat-card">
      <div class="num" th:text="${productCount}">0</div>
      <div class="label">Products</div>
    </div>
    <div class="stat-card">
      <div class="num" th:text="${orderCount}">0</div>
      <div class="label">Orders</div>
    </div>
  </div>

  <p style="color:#6b7269;font-size:0.9rem;">
    Manage your catalog and fulfil orders using the tabs above.
  </p>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
