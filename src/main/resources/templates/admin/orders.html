<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Manage Orders — JavaCart Admin</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments :: header}"></div>

<main class="container">
  <h1 class="page-title">Orders</h1>
  <div th:replace="~{admin/admin-fragments :: tabs(active='orders')}"></div>

  <div class="empty-state" th:if="${orders.isEmpty()}">No orders placed yet.</div>

  <table class="data-table" th:unless="${orders.isEmpty()}">
    <thead>
      <tr><th>Order #</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Update</th></tr>
    </thead>
    <tbody>
      <tr th:each="order : ${orders}">
        <td th:text="${order.id}">1</td>
        <td th:text="${order.user.username}">user</td>
        <td th:text="${#temporals.format(order.placedAt, 'dd MMM yyyy, HH:mm')}">date</td>
        <td th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">₹0.00</td>
        <td><span class="badge" th:classappend="'badge-' + ${order.status.name().toLowerCase()}" th:text="${order.status}">STATUS</span></td>
        <td>
          <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" style="display:flex;gap:6px;">
            <select name="status">
              <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == order.status}">STATUS</option>
            </select>
            <button type="submit" class="btn btn-outline btn-sm">Update</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
