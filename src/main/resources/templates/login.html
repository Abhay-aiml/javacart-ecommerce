<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Login — JavaCart</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments :: header}"></div>

<main class="container">
  <h1 class="page-title" style="text-align:center;">Log In</h1>

  <div class="form-card">
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${param.error}">Invalid username or password.</div>
    <div class="alert alert-success" th:if="${param.logout}">You've been logged out.</div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required="required" autofocus="autofocus"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required="required"/>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:0.88rem;">
      No account? <a href="/register" style="color:#1f4b43;font-weight:600;">Register here</a>
    </p>
    <p style="text-align:center;margin-top:8px;font-size:0.78rem;color:#6b7269;">
      Demo admin login: admin / admin123
    </p>
  </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
