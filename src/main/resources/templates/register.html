<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Register — JavaCart</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments :: header}"></div>

<main class="container">
  <h1 class="page-title" style="text-align:center;">Create an Account</h1>

  <div class="form-card">
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required="required"/>
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required="required"/>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required="required"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required="required" minlength="6"/>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:0.88rem;">
      Already have an account? <a href="/login" style="color:#1f4b43;font-weight:600;">Log in</a>
    </p>
  </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
